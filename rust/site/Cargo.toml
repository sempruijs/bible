[package]
name = "bible"
version = "0.1.0"
edition = "2021"

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8.2", features = ["csr"] }
peter = { path = "../peter" }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
uuid = { version = "1.18.0", features = ["v4", "js"] }
wasm-bindgen = "0.2"
